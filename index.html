  <style>
:root{color-scheme:dark;--page:#161815;--line:#393c30;--muted:#adad96;--paper:#efe9d5;--ochre:#d8b272;--song:"Songti SC","Noto Serif CJK SC",SimSun,serif;--sans:"Microsoft JhengHei","Microsoft YaHei",system-ui,sans-serif}
*{box-sizing:border-box}
body{min-height:100vh;margin:0;color:var(--paper);font:15px/1.55 var(--sans);background:radial-gradient(ellipse at 32% 56%,#24271d 0%,transparent 56%),var(--page)}

.lanyard{position:absolute;top:12px;left:calc(50% - 14px);width:28px;height:24px;background:#111410;border:2px solid #9e7c54;border-radius:50%;box-shadow:inset 0 3px 7px #060704,0 1px 3px #140e0b,0 0 0 3px #3e2c21}
.window{position:relative;overflow:hidden;border-radius:24px 24px 26px 17px;border:2px solid #8e714e;background:#202218;box-shadow:0 0 0 2px #17130f,0 0 0 3px #5e4c37,inset 0 0 14px #000}
.window:after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;box-shadow:inset 0 0 34px #060704a3;background:linear-gradient(156deg,#f0dd9c0d,transparent 38%)}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;touch-action:manipulation}
.window-label,.window-state{position:absolute;top:16px;z-index:1;color:#e2d7b3;font-size:11px;letter-spacing:.16em;text-shadow:0 1px 4px #000;pointer-events:none}
.window-label{left:17px}.window-state{right:17px}
.window-label i{display:inline-block;background:#d8ad6f;width:5px;height:5px;border-radius:50%;margin:0 5px 2px 0;box-shadow:0 0 8px #e9a23a}
.device-base{display:flex;align-items:center;justify-content:center;gap:10px;position:absolute;left:0;right:0;bottom:6px;color:#bc9870}
.device-base b{font:10px var(--song);letter-spacing:.12em}
.device-base span{width:15px;height:1px;background:#7c583d}
.stage-caption{display:flex;justify-content:space-between;gap:15px;margin-top:21px;color:var(--muted);font-size:12px;letter-spacing:.08em}
.stage-caption span:first-child{color:#d7c39b}
.control{padding:clamp(34px,5.3vw,77px) 0 5px}
.control-head{display:flex;align-items:center;justify-content:space-between}
.text-button{border:0;background:none;color:#dcc299;padding:3px 0;text-underline-offset:4px}
.text-button:hover{text-decoration:underline}
.journey{list-style:none;margin:24px 0 27px;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;color:#a09e89;font-size:12px}
.journey li{position:relative;line-height:1;display:grid;gap:9px;justify-items:start}
.journey li:after{content:"";position:absolute;top:4px;left:13px;right:4px;height:1px;background:#484737}
.journey li:last-child:after{display:none}
.journey li span{width:9px;height:9px;border:1px solid #7d775a;border-radius:50%}
.journey li.done span,.journey li[aria-current] span{background:#d9ad6e;border-color:#e0bb85}
.journey li[aria-current] span{box-shadow:0 0 9px #c6884b}
.journey li[aria-current]{color:#f0d3a7}
.narration{min-height:115px}
.narration h2{font:500 32px/1.15 var(--song);margin:0 0 10px}
.narration p{margin:0;color:#c5c5af;max-width:26em;line-height:1.65}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;min-height:44px}
.actions button,.bench-list button{min-height:44px;border-radius:6px;border:1px solid #62573f;padding:8px 10px}
.primary{background:#d7b17b;color:#21190f;font-weight:650}
.primary:hover:not(:disabled){background:#eaca98}
.secondary,.bench-list button{background:#24251d;color:#e4dac0}
.secondary:hover:not(:disabled),.bench-list button:hover{background:#35362a;border-color:#a88b61}
.wide{grid-column:1/-1}
.finds{margin-top:8px;display:flex;gap:20px;font-size:13px}
.mode-note{font-size:12px;color:#aead97;margin:12px 0 0;min-height:19px}
.bench{margin-top:19px;border-top:1px solid var(--line);padding-top:15px}
.bench-list{display:flex;gap:9px;margin-top:8px}
.bench-list button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;min-height:39px}
.mini{width:24px;height:16px;background:#b9ab80;display:inline-block}
.shape-shell{clip-path:polygon(0 85%,23% 56%,37% 27%,57% 20%,75% 38%,86% 57%,98% 64%,100% 83%,76% 86%,68% 100%,54% 100%,52% 88%,28% 93%,20% 100%,10% 100%,13% 89%)}
.shape-tail{clip-path:polygon(0 75%,7% 50%,25% 41%,35% 54%,21% 58%,17% 73%,27% 77%,47% 52%,59% 32%,65% 12%,80% 6%,100% 32%,81% 40%,71% 63%,68% 84%,82% 95%,62% 100%,56% 76%,40% 93%,20% 100%,6% 91%)}
.footer{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:32px;padding:13px 0 22px;font-size:12px;letter-spacing:.09em;color:#acac96}
@media(max-width:1050px){.wrap{width:calc(100% - 58px)}.layout{gap:32px;grid-template-columns:minmax(0,1fr) 272px}.device{padding:43px 22px 25px}}
@media(max-width:800px){.layout{grid-template-columns:1fr;gap:24px}.stage{padding:0 3px}.control{max-width:540px;width:100%;margin:0 auto;padding-top:6px}.intro{padding-top:26px}.footer{margin-top:25px}}
@media(max-width:470px){.wrap{width:calc(100% - 34px)}.masthead{height:60px}.mode{gap:6px}.mode label{font-size:11px}.intro{padding-bottom:14px}.device{padding:34px 14px 21px;border-radius:30px 30px 32px 18px}.device:before{inset:4px;border-radius:inherit}.lanyard{top:7px;width:23px;height:19px;left:calc(50% - 12px)}.window{border-radius:14px 14px 15px 10px}.window-label,.window-state{top:8px;font-size:9px}.window-label{left:9px}.window-state{right:9px}.stage-caption{margin-top:13px}.narration{min-height:100px}.journey{margin:17px 0 20px}}


</style>

<body>
  <header class="masthead wrap">
    <a class="brand" href="./index.html" aria-label="壳旅首页"><span class="seal" aria-hidden="true">壳</span><span>壳旅 <small>SHELL JOURNEY</small></span></a>
    <div class="mode" id="modeBox">
      <label for="mode">生成方式</label>
      <select id="mode"><option value="local">本地造型 AI</option><option value="sim">模拟模式</option><option value="ai">联网模型</option></select>
    </div>
  </header>
  <main class="wrap">
    <section class="intro" aria-labelledby="title">
      <p class="eyebrow">一方漆器，一处栖居</p>
      <h1 id="title">壳旅</h1>
      <p class="subtitle">捧暖一枚石卵，看它在窗里醒来。</p>
    </section>
    <div class="layout">
      <section class="stage" aria-label="挂件">
        <div class="device">
          <div class="lanyard" aria-hidden="true"></div>
          <div class="window">
            <canvas id="world" width="640" height="360" aria-label="壳旅房间，点击地面可引导宠物走动" tabindex="0"></canvas>
            <span class="window-label" aria-hidden="true"><i></i> 苔石小室</span>
            <span class="window-state" id="windowState" aria-hidden="true">石卵</span>
          </div>
          <div class="device-base" aria-hidden="true"><span></span><b>壳旅</b><span></span></div>
        </div>
        <div class="stage-caption"><span>苔石小室</span><span id="floorHint">孵化后可点按地面，引它走动</span></div>
      </section>
      <section class="control" aria-label="陪伴操作">
        <div class="control-head"><p class="eyebrow">陪伴手记</p><button id="reset" class="text-button" type="button">换一枚蛋</button></div>
        <ol class="journey" id="journey">
          <li><span></span>初见</li><li><span></span>变壳</li><li><span></span>破壳</li><li><span></span>回家</li>
        </ol>
        <div class="narration" role="status" aria-live="polite">
          <h2 id="phase">石卵微温</h2>
          <p id="description">壳面有一对细纹。捧暖或轻叩，留下它最先记住的动静。</p>
        </div>
        <div class="actions">
          <button class="primary" id="primary" type="button">捧暖石卵</button>
          <button class="secondary" id="secondary" type="button">轻叩两声</button>
          <button class="secondary wide" id="tertiary" type="button" hidden></button>
        </div>
        <div class="finds" id="finds" hidden>
          <button id="lamp" type="button" class="text-button">安放铜灯</button>
          <button id="spear" type="button" class="text-button">装备芦矛</button>
        </div>
        <p class="mode-note" id="modeNote">模拟模式 · 互动会改变孵化造型。</p>
        <div class="bench">
          <p class="eyebrow">标杆回放</p>
          <div class="bench-list">
            <button data-rig="shell" type="button"><span class="mini shape-shell" aria-hidden="true"></span>背壳兽</button>
            <button data-rig="tail" type="button"><span class="mini shape-tail" aria-hidden="true"></span>摆尾兽</button>
          </div>
        </div>
      </section>
    </div>
  </main>
  <footer class="wrap footer"><span>壳旅 · 美术试玩</span><span>石卵 / 苔室 / 异兽</span></footer>
<script>
"use strict";
window.ShellArt = (() => {
  const ground = 281;
  const w = 640, h = 360;

"use strict";
const ShellProfiles = (() => {
  const tones = ["lacquer","ember","moss","jade"];
  const clamp = (v,min,max) => Math.max(min,Math.min(max,v));
  const limits={body:[.79,1.24],head:[.77,1.22],tail:[.78,1.25],posture:[-.68,.68],markAt:[-.8,.8]};
  const rigs=["shell","tail"];
  const moods=["shy","curious"];
  const benchmarks={
    shell:{rig:"shell",tone:"lacquer",mood:"shy",body:1.04,head:.94,tail:1,posture:0,markAt:0,shape:0,eggForm:0,mark:0},
    tail:{rig:"tail",tone:"moss",mood:"curious",body:1.02,head:.98,tail:1,posture:0,markAt:-.65,shape:0,eggForm:2,mark:2}
  };
  function rng(seed) {
    let a=seed>>>0;
    return () => {
      a=(a+0x6d2b79f5)>>>0;
      let t=Math.imul(a^(a>>>15),a|1);
      t^=t+Math.imul(t^(t>>>7),t|61);
      return ((t^(t>>>14))>>>0)/4294967296;
    };
  }
  const initial = seed => {
    const next=rng(seed);
    return {...benchmarks.shell,mark:Math.floor(next()*3),eggForm:Math.floor(next()*3)};
  };
  function simulate(seed,inputs) {
    const tap=inputs.filter(x=>x==="tap").length;
    const warm=inputs.length-tap;
    const rig=tap>warm?"tail":"shell";
    const next=rng((seed^((tap+1)*0x16aa9d17))>>>0);
    const range=(a,b)=>a+next()*(b-a);
    return {...initial(seed),rig,mood:tap>=warm?"curious":"shy",
      tone:tones[(rig==="tail"?2:0)+Math.floor(next()*2)],
      body:range(.81,1.23),head:range(.78,1.21),tail:range(.79,1.24),
      posture:range(-.64,.64),markAt:range(-.8,.8),shape:Math.floor(next()*3),
      eggForm:(initial(seed).eggForm+1+Math.floor(next()*2))%3};
  }
  function validate(value,initialEgg) {
    if(!value||typeof value!=="object"||Array.isArray(value)) throw new Error("缺少造型参数");
    if(!rigs.includes(value.rig)||!moods.includes(value.mood)||!tones.includes(value.tone)) throw new Error("造型分类无效");
    const result={rig:value.rig,tone:value.tone,mood:value.mood,mark:initialEgg.mark};
    for(const [key,[min,max]] of Object.entries(limits)) {
      if(!Number.isFinite(value[key])) throw new Error("造型数值无效");
      result[key]=clamp(value[key],min,max);
    }
    for(const key of ["shape","eggForm"]) {
      if(!Number.isInteger(value[key])||value[key]<0||value[key]>2) throw new Error("造型选项无效");
      result[key]=value[key];
    }
    return result;
  }
  return {initial,simulate,validate,benchmarks,limits,tones,rigs,moods,rng};
})();

<script>
"use strict";
const ShellShapeModel = (() => {
  const weights=typeof module==="undefined"?ShellShapeWeights:require("./shape-weights.js");
  const profiles=typeof module==="undefined"?ShellProfiles:require("./profiles.js");
  const keys=["body","head","tail","posture","markAt"];
  const sequences=["warm/warm","warm/tap","tap/warm","tap/tap"];

  function sample(seed,gestures){
    const gesture=sequences.indexOf(gestures.join("/"));
    if(gesture<0)throw new Error("造型模型需要两次有效互动");
    const initial=profiles.initial(seed);
    const next=profiles.rng((seed^Math.imul(gesture+1,0x3c6ef35f))>>>0);
    const total=weights.reduce((sum,component)=>sum+component.gestureCounts[gesture],0);
    let draw=next()*total;
    const component=weights.find(value=>(draw-=value.gestureCounts[gesture])<0);
    const noise=keys.map(()=>{
      const radius=Math.sqrt(-2*Math.log(Math.max(Number.EPSILON,next())));
      return radius*Math.cos(2*Math.PI*next());
    });
    const geometry=Object.fromEntries(keys.map((key,i)=>[
      key,component.factor[i].reduce((sum,loading,j)=>sum+loading*noise[j],component.center[i])
    ]));
    const tones=component.rig==="shell"?["lacquer","ember"]:["moss","jade"];
    return profiles.validate({
      ...geometry,rig:component.rig,shape:component.shape,tone:tones[Math.floor(next()*tones.length)],
      mood:gestures[1]==="tap"?"curious":"shy",
      eggForm:(initial.eggForm+1+component.shape%2)%3
    },initial);
  }
  return {sample};
})();
if(typeof module!=="undefined")module.exports=ShellShapeModel;

</script>

    ui.modeNote.textContent=state.bench?"标杆回放 · 固定造型":modeLabels[ui.mode.value]||
      (available?"真实 AI · 互动记录送往联网模型。":"联网模型 · 生成服务尚未连接。");
    ui.finds.hidden=!state.finds;
    button(ui.tertiary);
    if(state.phase==="egg") {
      ui.phase.textContent=state.pending?"听取壳内回应":state.interactions.length?"壳中有了回应":"石卵微温";
      ui.description.textContent=state.message||(state.interactions.length===1?"再留一次动静，看看它会怎样变壳。":"壳面有一对细纹。捧暖或轻叩，留下它最先记住的动静。");
      button(ui.primary,"捧暖石卵",()=>interact("warm"));
      button(ui.secondary,"轻叩两声",()=>interact("tap"));
    } else if(state.phase==="molt") {
      ui.phase.textContent="旧纹仍在";
      ui.description.textContent=state.bench?"看看哪一个部位先钻出石壳。":"新壳沿旧纹生长。等它准备好，托住石卵。";
      button(ui.primary,"托住石卵",hatch);
      button(ui.secondary);
    } else if(state.phase==="hatch") {
      ui.phase.textContent=state.pet.rig==="shell"?"有触须探出来":"长尾探出壳沿";
      ui.description.textContent=state.pet.rig==="shell"?"它贴着石面，用力拱起顶上的整片旧壳。":"它用尾梢撑住地面，把身体从壳里推出来。";
      button(ui.primary);button(ui.secondary);
    } else {
      const action=state.action?.kind;
      ui.phase.textContent=action==="feed"?"碗里有草香":state.hunger||names[state.pet.rig]+"回家了";
      ui.description.textContent=state.message||(action==="firstWalk"
        ?"它把脚掌按在湿石上，迈出第一步。":"旧纹留在它身上。放一叶草药，或点点窗边试试。");
      button(ui.primary,"喂一叶草药",feed);
      button(ui.secondary,"轻叩窗沿",knock);
      if(!state.finds)button(ui.tertiary,"去石隙探路",adventure);
      button(ui.lamp,state.lampPlaced?state.lampOn?"熄灭铜灯":"点亮铜灯":"安放铜灯",placeLamp);
      button(ui.spear,state.equipped?"收起芦矛":"装备芦矛",equip);
      for(const key of ["primary","secondary","tertiary","lamp","spear"])ui[key].disabled=busy();
    }
  }
  async function serviceStatus() {
    if(!serviceURL&&(location.protocol==="file:"||location.hostname.endsWith(".github.io")))return;
    try {
      const r=await fetch(api("api/status"),{signal:AbortSignal.timeout(2500)});
      available=r.ok&&(await r.json()).available===true;
    } catch {available=false;}
    refresh();
  }
  async function requestProfile(seed,interactions) {
    const r=await fetch(api("api/generate"),{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({seed,interactions}),signal:AbortSignal.timeout(16000)});
    if(!r.ok)throw new Error("服务暂不可用");
    return P.validate(await r.json(),P.initial(seed));
  }
  async function interact(kind) {
    if(state.phase!=="egg"||state.pending)return;
    if(ui.mode.value==="ai"&&!available) {
      state.message="连接生成服务后可使用联网模型。也可以切换本地造型 AI 继续。";
      refresh();return;
    }
    state.interactions.push(kind);
    state.lastGesture={kind,t:now()};
    state.message=kind==="warm"?"壳慢慢回暖。再陪它片刻。":"壳在原地轻轻一颤。再留一次动静。";
    state.began=now()-.83;
    if(state.interactions.length<2){refresh();return;}
    sound(kind==="tap"?167:106,.23,.03);
    const run=++ticket;
    const {seed,interactions}=state;
    const source=ui.mode.value;
    state.pending=true; refresh();
    try {
      const result=source==="ai"?await requestProfile(seed,interactions):source==="local"
        ?ShellShapeModel.sample(seed,interactions):P.simulate(seed,interactions);
      if(run!==ticket)return;
      state.pet=result;state.source=source;state.pending=false;state.message="";
      phase("molt");
    } catch {
      if(run!==ticket)return;
      state.interactions.pop();state.pending=false;
      state.message="本次生成未完成。再试一次，或切换模拟模式。";refresh();
    }
  }
  function benchmark(rig) {
    fresh();
    state.bench=rig;state.source="benchmark";state.egg={...P.benchmarks[rig]};
    state.pet={...P.benchmarks[rig],eggForm:(state.egg.eggForm+1)%3};
    state.began=now();
    refresh();
    const run=ticket;
    setTimeout(()=>{if(run!==ticket||state.phase!=="egg")return;phase("molt");},650);
    setTimeout(()=>{if(run===ticket&&state.phase==="molt")hatch();},1750);
  }
  function hatch() {
    if(state.phase!=="molt")return;
    sound(112,.22,.04);
    phase("hatch");
  }
  function duration(dist) {
    return Math.max(.47,dist/(state.pet.rig==="shell"?52:75));
  }
  function move(x,t=now(),kind="walk",then=null) {
    const dest=A.clamp(x,minX,maxX);
    const dist=Math.abs(dest-state.x);
    if(dist<3){if(then)then(t);return;}
    state.facing=Math.sign(dest-state.x);
    state.action={kind,t,d:duration(dist),from:state.x,to:dest,then,dist};
  }
  function foodAt(t) {
    state.facing=1;
    state.action={kind:"feed",t,d:state.pet.rig==="shell"?2.36:1.95};
    state.hunger="";
    refresh();
  }
  function feed() {
    if(state.phase!=="home"||busy())return;
    state.herb=1;
    state.message=state.pet.rig==="shell"
      ?"采来石缝草药。它先用触须试探碗沿。":"采来石缝草药。它弯下细颈叼起叶片。";
    const base=state.pet.rig==="shell"?399:434;
    const delta=(state.pet.head-1)*(state.pet.rig==="shell"?27:37);
    move(base-delta,now(),"toFood",foodAt);
    refresh();
  }
  function knock() {
    if(state.phase!=="home"||busy())return;
    sound(189,.13,.04);
    if(state.pet.mood==="shy") {
      state.action={kind:"shy",t:now(),d:1.48};
      state.message="它缩进壳沿，听了一会儿才探头。";
    } else {
      state.action={kind:"curious",t:now(),d:1.12};
      state.message="它凑到窗边，想看看外头是谁。";
    }
    refresh();
  }
  function busy() {
    return Boolean(state.action?.then||["feed","away","place"].includes(state.action?.kind));
  }
  function adventure() {
    if(state.finds||busy())return;
    state.trip=1;
    state.message="它沿着潮湿的石缝，往窗外探去。";
    move(maxX,now(),"depart",t=>{
      state.away=true;
      state.action={kind:"away",t,d:1.35,then:reenter};
      refresh();
    });
    refresh();
  }
  function reenter(t) {
    state.away=false;
    state.carrying=true;
    state.message="它从石隙带回铜灯和一柄旧芦矛。";
    move(433,t,"return",()=>{
      state.finds=true;
      state.trip=0;
      refresh();
    });
    refresh();
  }
  function placeLamp() {
    if(!state.finds||busy())return;
    if(state.lampPlaced) {
      state.lampOn=!state.lampOn;
      state.message=state.lampOn?"灯芯亮起，右边的湿石泛出铜光。":"灯芯熄了，右侧回到微暗。";
      refresh();return;
    }
    state.message="它把铜灯挪到右边的空石台。";
    move(513,now(),"carry",t=>{
      state.facing=1;
      state.action={kind:"place",t,d:1.02,then:()=>{
        state.placeProgress=0;state.carrying=false;
        state.lampPlaced=true;state.lampOn=true;
        state.message="铜灯安在右角，照亮了一小块湿石。";
        move(438,now());
        sound(254,.19,.022);refresh();
      }};
      refresh();
    });
    refresh();
  }
  function equip() {
    if(!state.finds||busy())return;
    state.equipped=!state.equipped;
    state.message=state.equipped?"磨旧的芦矛卡在背侧，探出了背缘。":"它把芦矛收了起来。";
    refresh();
  }
  let audio;
  function sound(hz,length,volume) {
    if(!audio||audio.state!=="running")return;
    const t=audio.currentTime;
    const osc=audio.createOscillator(),gain=audio.createGain();
    osc.type="sine";osc.frequency.setValueAtTime(hz,t);osc.frequency.exponentialRampToValueAtTime(hz*.65,t+length);
    gain.gain.setValueAtTime(volume,t);gain.gain.exponentialRampToValueAtTime(.001,t+length);
    osc.connect(gain);gain.connect(audio.destination);osc.start(t);osc.stop(t+length);
  }
  addEventListener("pointerdown",()=>{
    try {audio??=new AudioContext(); if(audio.state==="suspended")audio.resume().catch(()=>{});}catch{}
  },{once:true});
  function compose(t) {
    const elapsed=t-state.began;
    const a={t};
    if(state.phase==="hatch"&&elapsed>=2.8) {
      state.x=benchStartX;state.facing=1;
      state.phase="home";state.began=t;
      state.hungryAt=t+23;
      move(421,t,"firstWalk");
      refresh();
    }
    if(state.phase==="home"&&state.hungryAt&&t>state.hungryAt&&!state.action) {
      state.hungryAt=0;
      state.hungerSince=t;
      state.hunger=state.pet.rig==="shell"?"它把背壳压低了":"它望向食碗";
      state.message="它在等一叶草药。";
      refresh();
    }
    if(state.hunger) {
      const squash=A.step(0,1.65,t-state.hungerSince);
      a.dip=(state.pet.rig==="shell"?.57:.26)*squash+.04*Math.sin(t*2)*squash;
      a.crouch=.21*squash;
    }
    const action=state.action;
    if(!action)return a;
    const dt=t-action.t,q=A.clamp(dt/action.d);
    if(action.to!==undefined) {
      state.x=A.lerp(action.from,action.to,q);
      const shell=state.pet.rig==="shell";
      const stride=shell?34:52;
      const strideOffset=action.dist<stride?.08:0;
      a.walk=action.dist*q/stride+strideOffset;
      a.strength=Math.sin(A.clamp(q*5)*Math.PI/2)*Math.sin(A.clamp((1-q)*5)*Math.PI/2);
      if(!shell) {
        const bounce=(a.walk*2)%1;
        a.crouch=Math.sin(A.step(0,.28,bounce)*Math.PI)*a.strength*.36;
        a.air=Math.sin(A.step(.19,.83,bounce)*Math.PI)*a.strength*7;
        a.tailAir=Math.sin(A.step(.31,.98,bounce)*Math.PI)*a.strength*7;
      }
    } else if(action.kind==="feed") {
      const shell=state.pet.rig==="shell";
      a.reach=A.step(.04,.34,q)*(1-A.step(.79,.99,q));
      a.dip=A.step(shell?.24:.14,.53,q)*(1-A.step(.80,1,q));
      a.dip+=Math.sin(q*57)*.12*A.step(.47,.66,q)*(1-A.step(.7,.83,q));
      state.herb=1-A.step(.52,.8,q);
    } else if(action.kind==="shy"){
      a.startle=A.step(0,.12,q)*(1-A.step(.39,.62,q));
      a.reach=A.step(.56,.72,q)*(1-A.step(.85,1,q))*.52;
    } else if(action.kind==="curious"){
      a.lean=A.step(.04,.33,q)*(1-A.step(.73,1,q));
      a.reach=a.lean*.43;
    } else if(action.kind==="place"){
      state.placeProgress=A.step(0,1,q);
      a.dip=Math.sin(q*Math.PI)*.27;
    }
    if(q>=1) {
      state.action=null;
      if(action.kind==="feed") {
        state.hungryAt=t+35;
        state.message="草药吃完了，它舔了舔碗沿。";
        refresh();
      }
      if(action.kind==="firstWalk")refresh();
      if(action.then)action.then(t);
    }
    return a;
  }
  function frame(stamp) {
    const t=stamp/1000;
    const a=compose(t);
    A.room(c,t,{herb:state.herb,lampOn:state.lampOn,lampPlaced:state.lampPlaced,trip:state.trip});
    const elapsed=t-state.began;
    if(state.phase==="egg"){
      const event=state.lastGesture;
      const age=event?t-event.t:1;
      const shake=event?.kind==="tap"&&age<.56?Math.sin(age*48)*(1-age/.56)*5:0;
      A.egg(c,cradleX+shake,state.egg,t);
    } else if(state.phase==="molt"){
      const melt=A.step(0,.62,elapsed);
      const p=melt<.48?state.egg:state.pet;
      A.egg(c,cradleX,p,t,melt);
    } else if(state.phase==="hatch"){
      A.egg(c,cradleX,state.pet,t,1,A.clamp(elapsed/2.8,.001,1));
    } else {
      if(!state.away) {
        A.pet(c,state.x,A.ground+(a.lean||0)*6,state.pet,a,{
          facing:state.facing,equipped:state.equipped,scale:1+(a.lean||0)*.04
        });
        if(state.carrying){
          const p=state.placeProgress;
          const lift=state.pet.rig==="shell"?35:48;
          A.lamp(c,A.lerp(state.x+state.facing*17,565,p),A.ground-lift*(1-p)+Math.sin(p*Math.PI)*-9,false);
        }
      }
    }
    world.dataset.phase=state.phase;
    world.dataset.action=state.action?.kind||"idle";
    world.dataset.rig=state.pet?.rig||"";
    world.dataset.generation=state.source||"";
    requestAnimationFrame(frame);
  }
  function canGuide() {
    return state.phase==="home"&&!busy();
  }
  world.addEventListener("pointerup",e=>{
    const r=world.getBoundingClientRect();
    if(canGuide())move((e.clientX-r.left)/r.width*A.w);
  });
  world.addEventListener("keydown",e=>{
    if(!["ArrowLeft","ArrowRight"].includes(e.key)||!canGuide())return;
    e.preventDefault();move(state.x+(e.key==="ArrowLeft"?-67:67));
  });
  ui.mode.addEventListener("change",()=>{fresh();if(ui.mode.value==="ai")serviceStatus();});
  ui.reset.onclick=()=>fresh();
  document.querySelectorAll("button[data-rig]").forEach(el=>el.onclick=()=>benchmark(el.dataset.rig));
  // The query seed makes art review captures repeatable.
  const seedParam=params.get("seed");
  const defaultMode=params.get("mode");
  ui.mode.value=["local","sim","ai"].includes(defaultMode)?defaultMode:serviceURL?"ai":"local";
  fresh(seedParam!==null&&/^\d{1,10}$/.test(seedParam)?Number(seedParam)>>>0:randomSeed());
  if(ui.mode.value==="ai")serviceStatus();
  requestAnimationFrame(frame);
})();

</script>
</body>
</html>
